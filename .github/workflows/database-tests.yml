name: Database Regression Tests

on:
  pull_request:
  push:
    branches: [staging]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  database:
    name: Migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.101.0
      - name: Replay migrations and run database regressions
        run: bash tools/test-database.sh
